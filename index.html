    R.start.classList.toggle('hidden', recOn);
    R.stop.classList.toggle('hidden', !recOn);
    R.state.textContent = recOn ? 'Grabando… toque la canción. Con 1 segundo de silencio empieza otra frase.' : recNotes.length ? 'Listo. Escuche el resultado y guárdelo.' : 'Toque Grabar y empiece a tocar.';
    R.state.classList.toggle('rec', recOn);

  async function recStart() {

    playH = playSequence(m.flat, { times: rhythmTimes(m, m.flat.map((_, i) => i), 1), onEnd: () => { playH = null; } });

  /* ---- desde un archivo de audio o video ---- */
  const F = {};
  function readFile(file) {
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => resolve(fr.result);
      fr.onerror = () => reject(fr.error || new Error('No pude leer el archivo'));
      fr.readAsArrayBuffer(file);
    });
  }
  async function decodeOnce(buf) {
    const AC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (!AC) throw new Error('Este navegador no puede leer audio de archivos');
    const ctx = new AC(1, 44100, 44100);
    /* decodeAudioData puede avisar por callback Y por promesa: se toma una sola respuesta */
    return new Promise((resolve, reject) => {
      let settled = false;
      const ok = (b) => { if (!settled) { settled = true; resolve(b); } };
      const bad = (e) => { if (!settled) { settled = true; reject(e || new Error('decode')); } };
      try {
        const pr = ctx.decodeAudioData(buf, ok, bad);
        if (pr && typeof pr.then === 'function') pr.then(ok, bad);
      } catch (e) { bad(e); }
    });
  }
  async function transcribeFile(file) {
    const job = ++jobId;
    F.status.className = 'se-state busy';
    F.status.textContent = 'Leyendo el archivo…';
    F.prog.style.width = '4%';
    try {
      const buf = await readFile(file);
      if (job !== jobId) return;
      F.status.textContent = 'Preparando el sonido…';
      const audio = await decodeOnce(buf);
      if (job !== jobId) return;
      const n = audio.length, chn = audio.numberOfChannels;
      const mono = new Float32Array(n);
      for (let c = 0; c < chn; c++) { const d = audio.getChannelData(c); for (let i = 0; i < n; i++) mono[i] += d[i] / chn; }
      F.status.textContent = 'Buscando las notas… (' + Math.round(audio.duration) + ' s de audio)';
      const res = await transcribeSamples(mono, audio.sampleRate, { onProgress: (x) => { F.prog.style.width = Math.max(4, Math.round(x * 100)) + '%'; } });
      if (job !== jobId || appliedJob === job) return; // una sola vez
      appliedJob = job;
      const total = res.lines.reduce((a, l) => a + l.length, 0);
      F.prog.style.width = '100%';
      if (!total) {
        F.status.className = 'se-state warn';
        F.status.textContent = 'No encontré notas. Pruebe con el violín más fuerte o más cerca del micrófono.';
        return;
      }
      setBpm(res.bpm);
      setText(rlinesToText(res.rlines));
      F.status.className = 'se-state ok';
      F.status.textContent = 'Listo: encontré ' + total + ' notas en ' + res.lines.length + (res.lines.length === 1 ? ' frase' : ' frases') + ', a ' + res.bpm + ' tiempos por minuto. ' + tuneSentence(res.tune) + ' Revíselas, escuche y guarde.';
      F.result = { total, lines: res.lines.length };
    } catch (e) {
      F.status.className = 'se-state warn';
      F.status.textContent = 'No pude leer el sonido de ese archivo (' + ((e && e.name) || 'error') + '). Pruebe con .mp3, .m4a, .wav o .mp4.';
    }
  }

  function drawPane() {
    E.pane.innerHTML = '';

/* ============ Sacar una canción de un audio o video (para la niña) ============
   1) elige un video o audio  2) la app escucha el sonido y saca notas, ritmo y velocidad
   3) lo compara con la grabación (que se puede poner más lenta)  4) lo guarda y entra a su camino */

/* leer un archivo de audio o video y devolver su sonido en un solo canal */
function readFileBuf(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result);
    fr.onerror = () => reject(fr.error || new Error('No pude leer el archivo'));
    fr.readAsArrayBuffer(file);
  });
}
function decodeBufOnce(buf) {
  const AC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  if (!AC) return Promise.reject(new Error('Este navegador no puede leer audio de archivos'));
  const ctx = new AC(1, 44100, 44100);
  return new Promise((resolve, reject) => {
    let settled = false;
    const ok = (b) => { if (!settled) { settled = true; resolve(b); } };
    const bad = (e) => { if (!settled) { settled = true; reject(e || new Error('decode')); } };
    try {
      const pr = ctx.decodeAudioData(buf, ok, bad);
      if (pr && typeof pr.then === 'function') pr.then(ok, bad);
    } catch (e) { bad(e); }
  });
}
async function analyzeMediaFile(file, onStep) {
  onStep && onStep('Leyendo el archivo…', 0.03);
  const buf = await readFileBuf(file);
  onStep && onStep('Sacando el sonido del archivo…', 0.06);
  const audio = await decodeBufOnce(buf);
  const n = audio.length, chn = audio.numberOfChannels;
  const mono = new Float32Array(n);
  for (let c = 0; c < chn; c++) { const d = audio.getChannelData(c); for (let i = 0; i < n; i++) mono[i] += d[i] / chn; }
  const res = await transcribeSamples(mono, audio.sampleRate, { onProgress: (x) => onStep && onStep('Escuchando nota por nota… (' + Math.round(audio.duration) + ' s)', 0.08 + 0.9 * x) });
  res.duration = audio.duration;
  res.total = res.rlines.reduce((a, l) => a + l.length, 0);
  res.text = res.total ? rlinesToText(res.rlines) : '';
  return res;
}
/* mover toda una canción k medios tonos (con octava escrita en cada nota para no perder la altura) */
function transposeText(text, k) {
  const m = buildModel({ id: 't', name: 't', color: '#fff', oct: 0, text });
  const parsed = parseSong(text);
  let gi = 0;
  const lines = parsed.lines.map((l) => l.map((n) => { const mm = m.flat[gi++] + k; return { pc: pcOf(mm), m: mm, d: n.d, r: n.r }; }));
  return rlinesToText(lines);
}
function tuneSentence(c) {
  if (!c) return 'El instrumento estaba bien afinado.';
  return 'El instrumento sonaba ' + Math.abs(c) + ' centésimos ' + (c > 0 ? 'alto' : 'bajo') + '; lo tomé en cuenta para no confundir notas.';
}

Screens.extract = function () {
  const E = {};
  const st = { res: null, model: null, h: null, url: null, job: 0, file: null };
  const slot = h('div', { class: 'vslot listen' });
  E.inp = h('input', { type: 'file', accept: 'audio/*,video/*,.mp3,.m4a,.wav,.mp4,.mov,.aac,.ogg,.webm,.3gp,.opus', id: 'ex-file', class: 'filein' });
  E.inp.addEventListener('change', () => { const f = E.inp.files && E.inp.files[0]; E.inp.value = ''; if (f) run(f); });
  E.pick = h('label', { class: 'btn pink big filebtn', for: 'ex-file', id: 'ex-pick' }, icon('file', 30), h('span', { class: 'bt' }, 'Elegir video o audio'));
  E.state = h('div', { class: 'se-state', id: 'ex-state' }, 'Para que salga bien: que suene solo el violín (sin piano ni pista), en un lugar callado.');
  E.prog = h('div', { class: 'pfill', id: 'ex-prog' });
  E.res = h('div', { class: 'ex-res hidden', id: 'ex-res' });
  const step1 = h('div', { class: 'ex-card' }, h('div', { class: 'ex-h' }, h('span', { class: 'ex-num' }, '1'), 'Elegí la grabación'), h('div', { class: 'ex-row' }, E.pick, E.inp), E.state, h('div', { class: 'pbar thin' }, E.prog));

  function stopSynth() {
    if (st.h) { const hh = st.h; st.h = null; try { hh.stop(); } catch (e) { /* nada */ } }
    $$('.chip', E.res).forEach((c) => c.classList.remove('now'));
    Violin.setTarget(null);
    if (E.play) { E.play.classList.remove('hidden'); E.stop.classList.add('hidden'); }
  }
  function playSynth(from) {
    stopSynth();
    if (E.media) E.media.pause();
    const m = st.model, k = E.mix.semis();
    const a = from || 0;
    const idxs = m.flat.map((_, i) => i).slice(a);
    E.play.classList.add('hidden'); E.stop.classList.remove('hidden');
    const me = playSequence(idxs.map((i) => m.flat[i] + k), {
      times: rhythmTimes(m, idxs, E.mix.speed()),
      onNote: (j, mm) => {
        st.cur = a + j;
        $$('.chip', E.res).forEach((c) => c.classList.toggle('now', +c.dataset.gi === a + j));
        const c = $('.chip.now', E.res);
        if (c && c.scrollIntoView) c.scrollIntoView({ block: 'nearest', inline: 'nearest' });
        if (mm >= VIOLIN_LO && mm <= VIOLIN_HI) Violin.setTarget(mm, { show: true }); else Violin.setTarget(null);
      },
      onEnd: () => { if (st.h === me) { st.h = null; stopSynth(); } },
    });
    st.h = me;
  }
  function relabel() {
    const k = E.mix ? E.mix.semis() : 0;
    $$('.chip', E.res).forEach((c) => { const m = +c.dataset.m + k; c.firstChild.replaceWith(noteLabel(m)); c.style.setProperty('--c', pcColor(m)); });
  }

  async function run(file) {
    const job = ++st.job;
    stopSynth();
    st.file = file;
    E.res.classList.add('hidden');
    E.state.className = 'se-state busy';
    E.prog.style.width = '3%';
    try {
      const res = await analyzeMediaFile(file, (msg, x) => { if (job === st.job) { E.state.textContent = msg; E.prog.style.width = Math.max(3, Math.round(x * 100)) + '%'; } });
      if (job !== st.job) return;
      E.prog.style.width = '100%';
      if (!res.total) {
        E.state.className = 'se-state warn';
        E.state.textContent = 'No escuché notas claras. Probá con el violín más cerca del celular, más fuerte, o sin música de fondo.';
        return;
      }
      st.res = res;
      st.model = buildModel({ id: 'ex', name: 'ex', color: '#ffb3d9', oct: 0, bpm: res.bpm, text: res.text });
      E.state.className = 'se-state ok';
      E.state.textContent = '¡Listo! Escuché ' + res.total + ' notas en ' + res.rlines.length + (res.rlines.length === 1 ? ' frase.' : ' frases.');
      showResult(file);
      SFX.fanfare();
      try { Log.event('analizó una grabación', { detalle: (file.name || 'archivo').slice(0, 60) + ' · ' + res.total + ' notas · ' + res.bpm + ' tiempos/min · afinación ' + res.tune + ' cents', segundos: Math.round(res.duration) }); } catch (e) { /* nada */ }
    } catch (e) {
      if (job !== st.job) return;
      E.state.className = 'se-state warn';
      E.state.textContent = 'No pude sacar el sonido de ese archivo (' + ((e && e.name) || 'error') + '). Probá con un video de WhatsApp, .mp4, .mp3, .m4a o .wav.';
    }
  }

  function showResult(file) {
    const res = st.res, m = st.model;
    E.res.innerHTML = '';
    /* la grabación de verdad, para comparar (se puede poner lenta sin cambiar el tono) */
    if (st.url) { try { URL.revokeObjectURL(st.url); } catch (e) { /* nada */ } }
    st.url = URL.createObjectURL(file);
    const isVid = /^video\//.test(file.type || '') || /\.(mp4|mov|webm|3gp|mkv)$/i.test(file.name || '');
    E.media = h(isVid ? 'video' : 'audio', { controls: '', playsinline: '', preload: 'metadata', class: 'ex-media', id: 'ex-media', src: st.url });
    E.media.addEventListener('play', () => stopSynth());
    const rateBtns = h('div', { class: 'ex-rates' });
    [[0.5, 'x0,5'], [0.75, 'x0,75'], [1, 'Normal']].forEach(([r, t]) => {
      const b = btn(t, { c: r === 1 ? 'sun' : 'white', cls: 'sm ex-rate', onclick: () => {
        E.media.playbackRate = r; try { E.media.preservesPitch = true; E.media.webkitPreservesPitch = true; } catch (e) { /* nada */ }
        $$('.ex-rate', rateBtns).forEach((x) => { x.classList.toggle('sun', x === b); x.classList.toggle('white', x !== b); });
      } });
      b.dataset.rate = r;
      rateBtns.append(b);
    });
    const card2 = h('div', { class: 'ex-card' },
      h('div', { class: 'ex-h' }, h('span', { class: 'ex-num' }, '2'), 'La grabación'),
      E.media,
      h('div', { class: 'ex-row' }, h('span', { class: 'ex-note' }, 'Más lento sin cambiar el tono:'), rateBtns));
    /* lo que entendió la app */
    const rows = h('div', { class: 'ls-rows ex-rows', id: 'ex-rows' });
    let gi = 0;
    m.lines.forEach((line, li) => {
      const chips = h('div', { class: 'row' });
      line.forEach((mm) => { chips.append(h('div', { class: 'chip beats ' + durClass(m.durs[gi]), 'data-gi': gi, 'data-m': mm, style: { '--c': pcColor(mm) } }, noteLabel(mm), beatDots(m.durs[gi]))); gi++; });
      rows.append(h('div', { class: 'ls-row' }, h('span', { class: 'ex-ln' }, String(li + 1)), chips));
    });
    E.mix = makeMixer({ bpm: res.bpm, onChange() { relabel(); if (st.h) playSynth(st.cur || 0); } });
    E.play = btn('Escuchar cómo la entendí', { c: 'sky', big: true, ic: 'play', id: 'ex-play', onclick: () => playSynth(0) });
    E.stop = btn('Parar', { c: 'white', ic: 'stop', id: 'ex-stop', cls: 'hidden', onclick: stopSynth });
    const card3 = h('div', { class: 'ex-card' },
      h('div', { class: 'ex-h' }, h('span', { class: 'ex-num' }, '3'), 'Lo que escuché'),
      h('div', { class: 'ex-facts', id: 'ex-facts' },
        h('span', null, h('b', null, res.total), ' notas'),
        h('span', null, h('b', null, res.rlines.length), res.rlines.length === 1 ? ' frase' : ' frases'),
        h('span', null, h('b', null, res.bpm), ' tiempos por minuto')),
      h('div', { class: 'ex-note', id: 'ex-tune' }, tuneSentence(res.tune) + (res.dropped ? ' Dejé fuera ' + res.dropped + (res.dropped === 1 ? ' sonido' : ' sonidos') + ' más graves de lo que un violín puede tocar (otro instrumento o ruido).' : '') + ' La rayita bajo cada nota dice cuánto dura.'),
      rows, E.mix.el, h('div', { class: 'ls-ctl' }, E.play, E.stop));
    /* guardar */
    E.name = h('input', { class: 'field', id: 'ex-name', maxlength: '60', placeholder: 'Nombre de la canción', value: (file.name || '').replace(/\.[a-z0-9]+$/i, '').replace(/^(VID|AUD|PTT)[-_ ]?\d+[-_ ]?(WA\d+)?$/i, '').replace(/[_-]+/g, ' ').trim().slice(0, 60) });
    E.save = btn('Guardar en mis canciones', { c: 'pink', big: true, ic: 'check', id: 'ex-save', onclick: saveSong });
    const card4 = h('div', { class: 'ex-card' },
      h('div', { class: 'ex-h' }, h('span', { class: 'ex-num' }, '4'), 'Guardala para aprenderla'),
      h('div', { class: 'ex-row' }, E.name, E.save),
      h('div', { class: 'ex-note' }, 'Se guarda con la velocidad y el tono que elegiste arriba. Se arma su caminito: sus notas, 4 fases y el ensayo. Si algo sonó raro, un adulto la puede corregir en Adultos › Canciones.'));
    E.res.append(card2, card3, card4);
    E.res.classList.remove('hidden');
    later(() => { if (card2.scrollIntoView) card2.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 150);
  }

  function saveSong() {
    const name = (E.name.value || '').trim();
    if (!name) { toast('Ponele un nombre a la canción'); E.name.focus(); return; }
    const k = E.mix ? E.mix.semis() : 0;
    const text = k ? transposeText(st.res.text, k) : st.res.text;
    const song = { id: uid(), name: name.slice(0, 60), color: SONG_COLORS[S.songs.length % SONG_COLORS.length], oct: 0, bpm: Math.round(st.res.bpm * (E.mix ? E.mix.speed() : 1)), text };
    S.songs.push(song);
    saveNow();
    try { Log.event('creó una canción', { cancion: song.name, detalle: st.res.total + ' notas · ' + song.bpm + ' tiempos/min' + (k ? ' · tono ' + (k > 0 ? '+' : '') + k : ''), notas: song.text.replace(/\n/g, ' | ').slice(0, 900) }); } catch (e) { /* nada */ }

/* ============ arranque ============ */
function hideSplash() {
  const sp = document.getElementById('splash');
  if (!sp) return;
  sp.classList.add('gone');
  setTimeout(() => { if (sp.parentNode) sp.remove(); }, 600);
}
function startApp() {
  loadState();
  Mic.setSens(S.set.sens);
  fxInit();
  Violin.init();
  requestAnimationFrame(uiLoop);
  go('home');
  hideSplash();
  Log.load();
  Log.event('abrió la app', { detalle: (navigator.userAgent || '').slice(0, 120) });
}
/* si algo se rompe al arrancar, se dice con palabras claras (no una pantalla en blanco) */
function bootFailed(err) {
  console.error('arranque', err);
  const sp = document.getElementById('splash');
  if (sp) {
    sp.classList.remove('gone');
    sp.innerHTML = '<div class="sp-fail"><b>Algo no arrancó bien.</b><br>Cerrá la pestaña y abrí el archivo otra vez en Google Chrome.<br><small>' + esc((err && err.message) || err) + '</small></div>';
  }
}
(function boot() {
  try {
    if (document.fonts && document.fonts.ready) {
      Promise.race([document.fonts.ready, sleep(1200)]).then(() => { try { startApp(); } catch (e) { bootFailed(e); } });
    } else startApp();
  } catch (e) { bootFailed(e); }
})();
